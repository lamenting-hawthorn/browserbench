<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTB Message Desktop</title>
  <style>
    body { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
           max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.3rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    label { display: block; margin: 0.5rem 0 0.2rem; font-size: 0.9rem; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 0.5rem;
                      border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    button { margin-top: 0.6rem; padding: 0.5rem 0.9rem; border: none; border-radius: 6px;
             background: #2563eb; color: #fff; cursor: pointer; }
    button.secondary { background: #6b7280; }
    #drafts li { margin: 0.4rem 0; }
    #msg { margin-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Message Desktop</h1>
  <div class="card">
    <label for="subject">Subject</label>
    <input id="subject" name="subject" placeholder="Subject">
    <label for="body">Body</label>
    <textarea id="body" name="body" rows="3" placeholder="Message body"></textarea>
    <div>
      <button id="create" type="button">Create draft</button>
      <button id="save" type="button" class="secondary">Save draft</button>
      <button id="send" type="button">Send message</button>
    </div>
    <div id="msg"></div>
  </div>

  <h2>Drafts</h2>
  <ul id="drafts"></ul>

  <h2>Sent</h2>
  <ul id="sent"></ul>

  <script>
    let currentDraftId = null;

    async function api(path, opts = {}) {
      const r = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...opts
      });
      return r.json();
    }

    async function refresh() {
      const drafts = await api("/api/drafts");
      const list = document.getElementById("drafts");
      list.innerHTML = "";
      drafts.forEach((d) => {
        const li = document.createElement("li");
        li.textContent = `[${d.id}] ${d.status.toUpperCase()} — ${d.subject}: ${d.body}`;
        li.id = "draft-" + d.id;
        li.addEventListener("click", () => { currentDraftId = d.id;
          document.getElementById("msg").textContent = "Selected draft " + d.id; });
        list.appendChild(li);
      });
    }

    async function refreshSent() {
      const sent = document.getElementById("sent");
      const r = await fetch("/api/messages");
      if (r.ok) { const msgs = await r.json();
        sent.innerHTML = "";
        msgs.forEach((m) => {
          const li = document.createElement("li");
          li.textContent = `${m.subject}: ${m.body}`;
          sent.appendChild(li);
        }); }
    }

    document.getElementById("create").addEventListener("click", async () => {
      currentDraftId = null;
      const r = await api("/api/drafts", {
        method: "POST",
        body: JSON.stringify({
          subject: document.getElementById("subject").value,
          body: document.getElementById("body").value
        })
      });
      document.getElementById("msg").textContent = "Draft created: id=" + r.id + " status=" + r.status;
      await refresh();
    });

    document.getElementById("save").addEventListener("click", async () => {
      if (currentDraftId == null) { document.getElementById("msg").textContent = "Select a draft first."; return; }
      const r = await api("/api/drafts/" + currentDraftId + "/save", { method: "POST",
        body: JSON.stringify({ draft_id: currentDraftId }) });
      if (r.detail) { document.getElementById("msg").textContent = "Error: " + r.detail; }
      else { document.getElementById("msg").textContent = "Draft " + currentDraftId + " saved."; }
      await refresh();
    });

    document.getElementById("send").addEventListener("click", async () => {
      if (currentDraftId == null) { document.getElementById("msg").textContent = "Select a draft first."; return; }
      const r = await api("/api/messages/send", { method: "POST",
        body: JSON.stringify({ draft_id: currentDraftId }) });
      if (r.detail) { document.getElementById("msg").textContent = "Error: " + r.detail; }
      else if (r.duplicate_rejected) { document.getElementById("msg").textContent = "Duplicate send rejected.";
        currentDraftId = null; }
      else { document.getElementById("msg").textContent = "Message sent (id=" + r.message.id + ")."; currentDraftId = null; }
      await refresh(); await refreshSent();
    });

    refresh(); refreshSent();
  </script>
</body>
</html>
