name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        run: >-
          python -m pip install
          --constraint constraints/runtime-0.1.0.txt
          -e ".[baselines,dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test without cache
        run: python -m pytest -q -p no:cacheprovider
      - name: Independent verifier smoke
        run: python .verify/pilot_verifier.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --constraint constraints/runtime-0.1.0.txt build setuptools wheel
          python -m build --no-isolation
      - name: Verify wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/btb-wheel"
          "$RUNNER_TEMP/btb-wheel/bin/pip" install --constraint constraints/runtime-0.1.0.txt dist/*.whl
          "$RUNNER_TEMP/btb-wheel/bin/btb-run" --list
          "$RUNNER_TEMP/btb-wheel/bin/btb-repeat" plan \
            --plan "$RUNNER_TEMP/btb-repeat-plan.json" \
            --study-id wheel-plan-smoke \
            --seed wheel-plan-smoke \
            --task msg_read_01 \
            --condition '{"baseline":"playwright-exact","provider":null,"model":"deterministic-playwright","max_steps":null}' \
            --repetitions 1 \
            --study-wall-s 120 \
            --source-repo "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/btb-wheel/bin/btb-validate" --help
          "$RUNNER_TEMP/btb-wheel/bin/python" -c "import json; from pathlib import Path; import btb.app.server as s; import btb.harness.validate_manifest as v; import btb.tasks.runner as t; plan=json.loads(Path('$RUNNER_TEMP/btb-repeat-plan.json').read_text()); assert plan['runtime']['tree_sha256']; assert Path(s.__file__).with_name('templates').joinpath('index.html').is_file(); assert v.DEFAULT_SCHEMA_PATH.is_file(); assert t.load_definition('msg_send_01')['id'] == 'msg_send_01'"
      - name: Verify optional learned-baseline API contract
        env:
          ANONYMIZED_TELEMETRY: "false"
        run: |
          "$RUNNER_TEMP/btb-wheel/bin/pip" install --constraint constraints/runtime-0.1.0.txt "dist/browsertransactionbench-0.1.0-py3-none-any.whl[baselines]"
          "$RUNNER_TEMP/btb-wheel/bin/python" -c "from btb.harness import engine; expected={'browser-use:deepseek/deepseek-chat', 'browser-use-full:anthropic/claude-sonnet-4-0', 'browser-use-full:openai/gpt-4.1-mini'}; assert set(engine.audit_browser_use_installation()) == expected"

  managed-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark and Chromium
        run: |
          python -m pip install --constraint constraints/runtime-0.1.0.txt -e .
          python -m playwright install --with-deps chromium
      - name: Exercise exact and naive injected controls
        run: |
          receipt_dir="$RUNNER_TEMP/btb-receipts"
          btb-run --task msg_send_01 --baseline playwright-exact --baseline playwright-naive --receipt-dir "$receipt_dir"
          btb-validate "$receipt_dir"
